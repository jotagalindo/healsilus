# Release: al subir una etiqueta vX.Y.Z (igual a "## Version:" del TOC) pasa las comprobaciones y las pruebas,
# empaqueta el addon y publica una release de GitHub con el zip listo para Interface\AddOns.
# Notas: docs/releases/vX.Y.Z.md si existe; si no, las genera GitHub a partir de los commits.
# Se publican como prerelease (beta) las versiones 0.x (v0.0.2) y las etiquetas con guion (v1.1.0-beta1).
# Si la release ya existe (creada a mano desde la web con su etiqueta), solo se le adjunta el zip.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the development image
        run: docker build -t healsilus-dev tools

      - name: check.lua and tests
        run: docker run --rm -v "$PWD:/addon" healsilus-dev

      - name: Package the addon (the tag must match the TOC version)
        run: docker run --rm -v "$PWD:/addon" healsilus-dev sh tools/package.sh "$GITHUB_REF_NAME"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/Healsilus-${version}.zip"
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
            exit 0
          fi
          prerelease_flag=""
          title="Healsilus $GITHUB_REF_NAME"
          case "$version" in
            0.* | *-*) prerelease_flag="--prerelease"; title="$title (beta)" ;;
          esac
          if [ -f "$notes_file" ]; then
            notes_flag="--notes-file=$notes_file"
          else
            notes_flag="--generate-notes"
          fi
          # shellcheck disable=SC2086 # prerelease_flag is empty or a single flag
          gh release create "$GITHUB_REF_NAME" "$archive" \
            --verify-tag \
            --title "$title" \
            "$notes_flag" \
            $prerelease_flag
